name: JARVIS AI OS - CI & Supply Chain Security

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main, feature]

permissions:
  contents: read

jobs:
  supply-chain-and-tests:
    name: Dependency Audit & Master Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Check Requirements Synchronization
        run: |
          python -c "with open('requirements.txt') as f1, open('backend/requirements.txt') as f2: l1, l2 = f1.read().splitlines()[2:], f2.read().splitlines()[2:]; assert l1 == l2, 'requirements.txt and backend/requirements.txt have drifted!'"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Master Test Suite
        run: |
          pytest backend/tests/ -v --tb=short

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Node Supply Chain & Build Verification
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high || true
